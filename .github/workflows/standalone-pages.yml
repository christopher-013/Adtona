name: Deploy Adtona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify application and export fallbacks
        run: |
          npm run check
          npm run smoke
      - name: Precompute destination catalogs
        # Runs the browser research pipeline server-side for top tourist cities so most real
        # queries never hit the rate-limited runtime path. The script quality-gates every
        # catalog and merges the previous deploy's good entries, so coverage converges across
        # deploys. A bad research day must degrade coverage, never break the deploy: on a hard
        # crash, fall back to the previous deploy's file rather than shipping an empty one.
        timeout-minutes: 15
        run: |
          timeout --signal=TERM --kill-after=30s 12m node build-precomputed-catalogs.mjs --out precomputed-catalogs.json || echo "::warning::Precompute step timed out or failed; falling back to the previous deploy's catalogs."
          if [ ! -s precomputed-catalogs.json ]; then
            curl --connect-timeout 10 --max-time 30 -fsS -o precomputed-catalogs.json "https://christopher-013.github.io/Adtona/precomputed-catalogs.json" \
              || echo '{"generatedAt":"","count":0,"precomputedCatalogs":[]}' > precomputed-catalogs.json
          fi
      - name: Assemble standalone site
        run: |
          npm run build:cloudflare
          npm run verify:cloudflare
          mv dist _site
      - name: Verify artifact contents
        run: |
          missing=0
          for f in index.html robots.txt sitemap.xml 7d1c404caea77020637baef4b69b0b96.txt version.js catalogs.json precomputed-catalogs.json dynamic-catalog.js styles.css app.js beta-tools.js trip-schema.js export-styles.js icon-source.js photo-store.js sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png icons/favicon-32.png adtona-logo.png adtona-mark.png plan-x-guide-centered-compass-morph-clean-x.svg; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Missing required file in deployment artifact: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify search engines
        # Runs after the deploy so the URL being announced is already live. One IndexNow
        # ping reaches Bing, Yandex, Seznam and Naver. The Bing URL Submission API needs a
        # real Webmaster Tools credential, so it is skipped unless the secret is set.
        # A search-engine ping must never fail a release.
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node submit-indexnow.mjs
